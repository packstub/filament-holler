name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The plugin requires packstub/calls through a path repository (`../calls`, see
# composer.json) and, for the end-to-end job's npm install, packstub/calls-js. Both
# repos are private: read-only deploy keys (secrets CALLS_DEPLOY_KEY and
# CALLS_JS_DEPLOY_KEY) check them out. Once packstub/calls is on Packagist, CI can
# install it from there instead.

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Filament ${{ matrix.filament }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12.*", "13.*"]
        filament: ["4.*", "5.*"]
        dependencies: ["prefer-stable"]
        include:
          - laravel: "12.*"
            testbench: "10.*"
          - laravel: "13.*"
            testbench: "11.*"
          # The floors: 4.13.3 and 5.8.3 are the declared minimums (the first releases past the MFA
          # advisories PKSA-cnr1-6g7k-bp3d et al.), on the oldest PHP with the lowest versions of the rest.
          - { php: "8.3", laravel: "12.*", testbench: "10.*", filament: "4.13.3", dependencies: "prefer-lowest" }
          - { php: "8.3", laravel: "13.*", testbench: "11.*", filament: "4.13.3", dependencies: "prefer-lowest" }
          - { php: "8.3", laravel: "12.*", testbench: "10.*", filament: "5.8.3", dependencies: "prefer-lowest" }
          - { php: "8.3", laravel: "13.*", testbench: "11.*", filament: "5.8.3", dependencies: "prefer-lowest" }

    defaults:
      run:
        working-directory: filament-calls

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: filament-calls

      - name: Checkout packstub/calls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: packstub/calls
          ref: main
          ssh-key: ${{ secrets.CALLS_DEPLOY_KEY }}
          path: calls

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-filament${{ matrix.filament }}-${{ matrix.dependencies }}-${{ hashFiles('filament-calls/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --${{ matrix.dependencies }} --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest

  e2e:
    name: End-to-end (two browsers call each other)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: filament-calls

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: filament-calls

      - name: Checkout packstub/calls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: packstub/calls
          ref: main
          ssh-key: ${{ secrets.CALLS_DEPLOY_KEY }}
          path: calls

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: filament-calls/package-lock.json

      # npm ci clones @packstub/calls from the private packstub/calls-js over SSH.
      - name: Load the calls-js deploy key
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.CALLS_JS_DEPLOY_KEY }}"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: npx playwright test

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: filament-calls/test-results
          retention-days: 7
